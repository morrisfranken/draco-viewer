services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "54080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
      - ./drc-viewer.svg:/usr/share/nginx/html/drc-icon.svg
      - ./main.js:/usr/share/nginx/html/main.js
    deploy:
      resources:
        limits:
          memory: 2G
